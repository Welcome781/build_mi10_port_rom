name: actions_build_hyperos_port_umi
on:
  workflow_dispatch:
    inputs:
      STOCK_URL:
        description: "底包(umī MIUI14 官方整包, payload.bin) | BASEROM DIRECT LINK"
        required: true
        default: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V14.0.4.0.TJBCNXM/miui_UMI_V14.0.4.0.TJBCNXM_23fc5ef4ee_13.0.zip
      PORT_URL:
        description: "移植包(别机型 OS3/A16 官方或 eu 整包, payload.bin) | PORTROM DIRECT LINK"
        required: true
        default: https://sourceforge.net/projects/xiaomi-eu-multilang-miui-roms/files/xiaomi.eu/HyperOS-STABLE-RELEASES/HyperOS3.0/xiaomi.eu_FUXI_OS3.0.310.0.WMCCNXM_16_a668455fe6.zip/download
      PACK_TYPE:
        description: "打包类型 EXT/EROFS | EXT 可解锁 system 读写"
        default: EXT
        type: choice
        options:
        - EROFS
        - EXT
        required: true
      ENCRYPTION:
        description: "是否解密 data(TRUE/FALSE)"
        default: FALSE
        required: false
      GITHUBRELEASE:
        description: "产物上传到本仓库 GitHub Release"
        default: TRUE
        required: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库 | CHECKOUT
        uses: actions/checkout@main
        with:
          ref: main
          fetch-depth: 1
      - name: 2. 准备依赖 | PREPARE ENVIRONMENT
        run: |
          sudo apt update
          sudo apt install -y python3 aria2 zip p7zip-full zipalign android-sdk-libsparse-utils xmlstarlet bc openjdk-17-jre
          java -version
          python3 --version
      - name: 3. 开始移植 | START PORTING
        run: |
          git clone https://github.com/toraidl/hyperos_port.git -b ext
          cd hyperos_port
          mkdir -p tmp devices/umi devices/cmi
          cp -rfv tmp/BT*.zip devices/umi || true
          cp -rfv tmp/BT*.zip devices/cmi || true
          if [[ "${{ github.event.inputs.PACK_TYPE }}" == "EROFS" ]]; then
              sed -i "s/repack_with_ext4=true/repack_with_ext4=false/" bin/port_config
          fi
          if [[ "${{ github.event.inputs.ENCRYPTION }}" == "TRUE" ]]; then
              sed -i "s/remove_data_encryption=false/remove_data_encryption=true/" bin/port_config
          fi
          sudo timedatectl set-timezone Asia/Shanghai
          sudo bash port.sh "${{ github.event.inputs.STOCK_URL }}" "${{ github.event.inputs.PORT_URL }}"
      - name: 4. 准备产物分片 | PREPARE RELEASE ARTIFACTS
        run: |
          ROM_FILE=$(basename $(find "$GITHUB_WORKSPACE"/hyperos_port/out -name "*.zip" | head -n1))
          echo "ROM_FILE=$ROM_FILE" >>$GITHUB_ENV
          OS_VERSION=$(echo "$ROM_FILE" | cut -d "_" -f3)
          echo "OS_VERSION=$OS_VERSION" >>$GITHUB_ENV
          mkdir -p "$GITHUB_WORKSPACE"/hyperos_port/GithubRelease
          cd "$GITHUB_WORKSPACE"/hyperos_port/GithubRelease
          sudo split -b 1536M -d "$GITHUB_WORKSPACE"/hyperos_port/out/"$ROM_FILE" "$ROM_FILE"
          ls -al
      - name: 5. 上传 GitHub Release | UPLOAD RELEASE
        if: ${{ github.event.inputs.GITHUBRELEASE == 'TRUE' }}
        uses: ncipollo/release-action@main
        with:
          artifacts: ${{ github.workspace }}/hyperos_port/GithubRelease/*
          name: ${{ env.OS_VERSION }}
          tag: port-${{ github.run_number }}
          body: "umī HyperOS port build ${{ github.run_number }}. 分片需按后缀顺序 cat 合并为完整 zip 后校验 MD5 再刷入。"
          allowUpdates: true
          artifactErrorsFailBuild: true
